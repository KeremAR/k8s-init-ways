  labels:
    cluster.x-k8s.io/cluster-name: homelab
  name: homelab-workers-pve1
  namespace: default
spec:
  clusterName: homelab
  replicas: 1
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: homelab
        node-role.kubernetes.io/node: ""
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: homelab-worker
      clusterName: homelab
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: homelab-worker-pve1
      version: v1.36.1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: homelab-worker-pve1
  namespace: default
spec:
