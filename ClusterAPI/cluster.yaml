          sizeGb: 40
      format: qcow2
      full: true
      memoryMiB: 10240  # 10 GB RAM
      network:
        networkDevices:
        - bridge: vmbr0
          model: virtio
          name: net0
      numCores: 2
      numSockets: 1
      sourceNode: pve1  # Sadece pve1 üzerinde ayağa kalkacak
      templateID: 100
---
